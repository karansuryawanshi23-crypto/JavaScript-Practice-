<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator </title>
    <link rel="stylesheet" href="bmi.css">
</head>
<body>
    <form>
    <h1>BMI Calculator </h1>
    <h2>Caculate your BMI To Track Your Health</h2>
    <input type="text" name="Height" id="Height" placeholder="Enter Hight in Cm">
    <span><br>
    <input type="text" name="Weight In KG" id="Weight" placeholder="Enter Weight in kg">
    </span>
    <br>
   <button>Calculate</button>
   <div id="results"></div>
   <div id="weight-guide">
    <h3>BMI Weight Guide</h3>
    <p>Under Weight = Less Than 18.6</p>
    <p>Normal Range = 18.6 and 24.9</p>
    <p>Overweight = Greater Than 24.9</p>
   </div>
    </form>
</body>
<script src="bmi.js"></script>
</html>
